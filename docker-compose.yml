services:
  api:
    build: .
    image: fitness-agent:v0.1.0
    env_file: .env
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - SQLITE_DB_PATH=/app/data/app.db
      - CHROMA_DB_PATH=/app/data/chroma_db
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ui:
    build: .
    image: fitness-agent:v0.1.0
    env_file: .env
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - API_BASE_URL=http://api:8000
      - SQLITE_DB_PATH=/app/data/app.db
      - CHROMA_DB_PATH=/app/data/chroma_db
    volumes:
      - ./data:/app/data
      # Streamlit 密码配置（只读挂载；文件在 .gitignore 中，不进镜像/仓库）
      - ./.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro
    ports:
      - "8501:8501"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    command: streamlit run ui/app.py --server.port=8501 --server.address=0.0.0.0
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
